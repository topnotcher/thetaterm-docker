services:
  thetaterm:
    image: ghcr.io/topnotcher/thetaterm-docker/thetaterm:latest
    restart: always
    ports:
      - "127.0.0.1:25503:25503"
    environment:
        THETADATA_API_KEY_FILE: /run/secrets/thetadata_api_key
    secrets:
      - thetadata_api_key
    build:
      dockerfile: ./Dockerfile

secrets:
  thetadata_api_key:
    file: thetadata-api-key.txt
